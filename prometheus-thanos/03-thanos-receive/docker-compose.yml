name: study-03-thanos-receive

x-avalanche-args: &avalanche-args
  - --gauge-metric-count=50
  - --series-count=100
  - --label-count=5
  - --value-interval=10
  - --series-interval=0
  - --port=9001

x-thanos-image: &thanos-image quay.io/thanos/thanos:v0.42.4

services:
  avalanche-1:
    image: quay.io/prometheuscommunity/avalanche:latest
    container_name: avalanche-1
    command: *avalanche-args
    ports:
      - "9091:9001"

  avalanche-2:
    image: quay.io/prometheuscommunity/avalanche:latest
    container_name: avalanche-2
    command: *avalanche-args

  avalanche-3:
    image: quay.io/prometheuscommunity/avalanche:latest
    container_name: avalanche-3
    command: *avalanche-args

  prometheus-agent-1:
    image: prom/prometheus:latest
    container_name: prometheus-agent-1
    volumes:
      - ./prometheus/prometheus-agent-1.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-agent-1-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --agent
      - --storage.agent.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    depends_on:
      - avalanche-1
      - thanos-receive-1

  prometheus-agent-2:
    image: prom/prometheus:latest
    container_name: prometheus-agent-2
    volumes:
      - ./prometheus/prometheus-agent-2.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-agent-2-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --agent
      - --storage.agent.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      - avalanche-2
      - thanos-receive-2

  prometheus-agent-3:
    image: prom/prometheus:latest
    container_name: prometheus-agent-3
    volumes:
      - ./prometheus/prometheus-agent-3.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-agent-3-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --agent
      - --storage.agent.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      - avalanche-3
      - thanos-receive-3

  thanos-receive-1:
    image: *thanos-image
    container_name: thanos-receive-1
    user: "0:0"
    volumes:
      - thanos-receive-1-data:/data
      - ./receive/hashring.json:/etc/thanos/hashring.json:ro
      - ./thanos/bucket.yml:/etc/thanos/bucket.yml:ro
    command:
      - receive
      - --tsdb.path=/data
      - --tsdb.retention=48h
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
      - --remote-write.address=0.0.0.0:19291
      - --receive.replication-factor=3
      - --receive.local-endpoint=thanos-receive-1:10901
      - --receive.hashrings-file=/etc/thanos/hashring.json
      - --objstore.config-file=/etc/thanos/bucket.yml
      - --label=receive_replica="1"
    ports:
      - "10905:10902"
    depends_on:
      - minio-init

  thanos-receive-2:
    image: *thanos-image
    container_name: thanos-receive-2
    user: "0:0"
    volumes:
      - thanos-receive-2-data:/data
      - ./receive/hashring.json:/etc/thanos/hashring.json:ro
      - ./thanos/bucket.yml:/etc/thanos/bucket.yml:ro
    command:
      - receive
      - --tsdb.path=/data
      - --tsdb.retention=48h
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
      - --remote-write.address=0.0.0.0:19291
      - --receive.replication-factor=3
      - --receive.local-endpoint=thanos-receive-2:10901
      - --receive.hashrings-file=/etc/thanos/hashring.json
      - --objstore.config-file=/etc/thanos/bucket.yml
      - --label=receive_replica="2"
    depends_on:
      - minio-init

  thanos-receive-3:
    image: *thanos-image
    container_name: thanos-receive-3
    user: "0:0"
    volumes:
      - thanos-receive-3-data:/data
      - ./receive/hashring.json:/etc/thanos/hashring.json:ro
      - ./thanos/bucket.yml:/etc/thanos/bucket.yml:ro
    command:
      - receive
      - --tsdb.path=/data
      - --tsdb.retention=48h
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
      - --remote-write.address=0.0.0.0:19291
      - --receive.replication-factor=3
      - --receive.local-endpoint=thanos-receive-3:10901
      - --receive.hashrings-file=/etc/thanos/hashring.json
      - --objstore.config-file=/etc/thanos/bucket.yml
      - --label=receive_replica="3"
    depends_on:
      - minio-init

  memcached:
    image: memcached:1.6-alpine
    container_name: memcached
    command: ["-m", "64", "-I", "5m"]

  thanos-store:
    image: *thanos-image
    container_name: thanos-store
    user: "0:0"
    volumes:
      - thanos-store-data:/data
      - ./thanos/bucket.yml:/etc/thanos/bucket.yml:ro
      - ./thanos/index-cache.yml:/etc/thanos/index-cache.yml:ro
    command:
      - store
      - --data-dir=/data
      - --objstore.config-file=/etc/thanos/bucket.yml
      - --index-cache.config-file=/etc/thanos/index-cache.yml
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
    depends_on:
      - minio-init
      - memcached

  thanos-compact:
    image: *thanos-image
    container_name: thanos-compact
    user: "0:0"
    volumes:
      - thanos-compact-data:/data
      - ./thanos/bucket.yml:/etc/thanos/bucket.yml:ro
    command:
      - compact
      - --data-dir=/data
      - --objstore.config-file=/etc/thanos/bucket.yml
      - --wait
      - --wait-interval=30s
    depends_on:
      - minio-init

  thanos-query:
    image: *thanos-image
    container_name: thanos-query
    command:
      - query
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
      - --query.replica-label=receive_replica
      - --endpoint=thanos-receive-1:10901
      - --endpoint=thanos-receive-2:10901
      - --endpoint=thanos-receive-3:10901
      - --endpoint=thanos-store:10901
    ports:
      - "10904:10902"
    depends_on:
      - thanos-receive-1
      - thanos-receive-2
      - thanos-receive-3
      - thanos-store

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "19000:9000"
      - "19001:9001"

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      mc mb --ignore-existing local/thanos
      "
    depends_on:
      - minio

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../common/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - thanos-query

volumes:
  prometheus-agent-1-data:
  prometheus-agent-2-data:
  prometheus-agent-3-data:
  thanos-receive-1-data:
  thanos-receive-2-data:
  thanos-receive-3-data:
  thanos-store-data:
  thanos-compact-data:
  minio-data:
