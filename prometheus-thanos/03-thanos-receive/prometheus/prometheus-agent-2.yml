global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    agent: "2"

scrape_configs:
  - job_name: avalanche
    static_configs:
      - targets: ["avalanche-2:9001"]

  - job_name: prometheus-agent
    static_configs:
      - targets: ["localhost:9090"]

remote_write:
  - url: http://thanos-receive-2:19291/api/v1/receive
