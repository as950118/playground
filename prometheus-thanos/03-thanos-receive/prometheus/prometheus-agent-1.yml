global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    agent: "1"

scrape_configs:
  - job_name: avalanche
    static_configs:
      - targets: ["avalanche-1:9001"]

  - job_name: prometheus-agent
    static_configs:
      - targets: ["localhost:9090"]

remote_write:
  - url: http://thanos-receive-1:19291/api/v1/receive
